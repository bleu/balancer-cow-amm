name: CI

on: [push]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  MAINNET_RPC: ${{ secrets.MAINNET_RPC }}
  SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}

jobs:
  bnb-ondo-tests:
    name: BNB Ondo token compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOUNDRY_LINT_LINT_ON_BUILD: 'false'
      BNB_RPC_URL: ${{ secrets.BNB_RPC_URL || 'https://bsc-rpc.publicnode.com' }}
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'pnpm'
      - uses: foundry-rs/foundry-toolchain@v1.2.0
        with:
          version: nightly
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:bnb

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.2.0
        with:
          version: nightly

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Precompile contracts
        run: pnpm build

      - name: Run tests
        shell: bash
        run: pnpm test:unit

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.2.0
        with:
          version: nightly

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Precompile contracts
        run: pnpm build

      - name: Run tests
        run: pnpm test:integration

      - name: Ensure gas snapshots were updated
        run: git diff --exit-code -- .forge-snapshots/

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4

      - uses: wagoid/commitlint-github-action@v5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.2.0
        with:
          version: nightly

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install bulloak 
        uses: baptiste0928/cargo-install@v3
        with:
          crate: bulloak

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run forge-fmt && solhint
        run: pnpm lint:check

      - name: Run bulloak check
        run: pnpm lint:bulloak

      - name: Ensure auto-generated smocks are up to date
        run: pnpm smock && git diff --exit-code -- test/smock

      - name: Run natspec-smells
        run: pnpm lint:natspec 2>&1 >/dev/null | grep 'No issues found'

  demo-tests:
    name: Demo service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:demo
      - run: pnpm demo:build
      - run: pnpm demo:typecheck
